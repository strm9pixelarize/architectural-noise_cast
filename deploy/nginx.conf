# cast.architectural-n.net 自作トップページ用 nginx 設定（静的1ページ）
# conf.d に default.conf として配置する想定
# ベースは nekoOS 用改修版（SSI / Telemetry 除去＋セキュリティヘッダー入り）
# CSP は 2026-11-20 に追加 (手順4)。ページの外部依存を全数確認した上で組んである:
#   Google Fonts の CSS (fonts.googleapis.com) とフォント実体 (fonts.gstatic.com)、
#   cast 本体の API・ストリーム・アート画像 (同一オリジン)、inline style/script。
#   アート画像は通常同一オリジンだが、将来外部アートが来ても崩れないよう img-src は https: も許可

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml text/xml;

server_tokens off;

server {
    set_real_ip_from 172.16.0.0/12;  # Dockerのサブネット範囲
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        # SPA フォールバックはしない。/public や /listen 等は AzuraCast 側の領分で、
        # ここに来た未知のパスをトップで誤魔化さない
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # 放送内容 JSON (v4 で追加): ラジオ生成側の output を /radio-output に
    # 読取専用マウントし、4枠のサイドカーだけを /data/ で公開する
    # (MP3 本体は出さない)。生成のたびに中身が変わるのでキャッシュ無効。
    # add_header を1つでも書くと server 側の分が継承されないため、
    # 静的素材ロケーションと同じく全ヘッダーをここにも書く
    location ~ ^/data/(program_(12|15|18|21)_latest\.json)$ {
        alias /radio-output/$1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
